name: blog_app
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # จัดการผลลัพธ์สำเร็จ ข้อผิดพลาด และค่า null
  fpdart: ^1.2.0
  # เชื่อมต่อ Supabase สำหรับจัดการฐานข้อมูล ผู้ใช้ และไฟล์
  supabase_flutter: ^2.18.3
  # จัดการตัวแปรสภาพแวดล้อม (.env)
  flutter_dotenv: ^6.0.1
  # จัดการ State และ Business Logic
  flutter_bloc: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env.local

